org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag is required by the current Flutter Android template.
android.newDsl=false
# This builtInKotlin flag is required by the current Flutter Android template.
android.builtInKotlin=false
# Some older Flutter plugins are sourced from the C: pub cache while this
# project is on D:. Kotlin incremental caches cannot safely relativize those
# cross-drive paths, so disable only Kotlin incremental compilation.
kotlin.incremental=false
